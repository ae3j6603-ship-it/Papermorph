name: Publish Thai technology lesson
on:
  push:
    branches: [main]
    paths:
      - 'site/technology-m1/**'
      - '.github/workflows/publish-lesson.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: site/technology-m1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/technology-m1
      - name: Deploy lesson
        id: deployment
        uses: actions/deploy-pages@v4
